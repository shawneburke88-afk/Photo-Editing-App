name: AI models

# Pins and checks LightBench's AI model files on GitHub's servers, which can reach huggingface.co (docs/PHASE3.md
# Part 24, "Pinning and checking the models"). Run it by hand: Actions → "AI models" → Run workflow → "Use workflow
# from" the branch that has the AI models code (e.g. lightbench/depth-mask) → task. GitHub lists a manually run workflow
# only when it is on the default branch, so this same file is also on main, where it finds no AI models code and stops
# cleanly; run from another branch, that branch's copy runs.
#
#   pin-and-check  web/scripts/models.mjs pin (the Hugging Face commit, or `revision`; each file's Git LFS pointer; the
#                  download checked against it), then the real-model check (web/scripts/models-check.mjs), then commits
#                  web/models/manifest.json, and nothing else, to the branch it ran on (only if it changed and the
#                  check passed).
#   check          only the real-model check, of the files the branch's manifest pins (downloaded from Hugging Face).
#   masks-prep     read-only preparation check of the AI masks candidates (branch lightbench/ai-masks-prep only):
#                  pins (commit, licence, LFS sha256), ONNX inspection against ORT 1.30.0's WebGPU kernels, one CPU run
#                  each in onnxruntime-node, a WebGPU-EP run on software Vulkan, the MediaPipe TFLite comparison and
#                  the EfficientViT-Seg export (web/scripts/masks-prep.mjs, web/scripts/masks-prep/). Commits nothing.
#   masks-prep2    follow-up: SAM 2.1 fp32 WebGPU bisection and fix, BiRefNet_lite patch, both checked in onnxruntime-node
#                  and in headless Chromium (web/scripts/masks-prep2.mjs, masks-prep/fix_models.py, browser-run.mjs).

on:
  workflow_dispatch:
    inputs:
      task:
        description: "pin-and-check: pin web/models/manifest.json, check the real model and commit the manifest to this branch. check: only check the files the manifest pins."
        type: choice
        options:
          - pin-and-check
          - check
          - masks-prep
          - masks-prep2
        default: pin-and-check
        required: true
      revision:
        description: "Optional, pin-and-check only: the 40-digit Hugging Face commit to pin (empty: the model repository's current main)"
        type: string
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: ai-models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TASK: ${{ inputs.task }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Look for the AI models code
        id: code
        run: |
          echo "branch ${GITHUB_REF_NAME} at $(git rev-parse --short HEAD), task ${TASK}"
          if [ "${TASK}" = "masks-prep" ] || [ "${TASK}" = "masks-prep2" ]; then
            if [ -f web/scripts/masks-prep.mjs ]; then
              echo "found web/scripts/masks-prep.mjs"
              echo "present=true" >> "$GITHUB_OUTPUT"
            else
              echo "run masks-prep from lightbench/ai-masks-prep"
              echo "## AI models: masks-prep needs the branch lightbench/ai-masks-prep" >> "$GITHUB_STEP_SUMMARY"
              echo "present=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ -f web/scripts/models.mjs ] && [ -f web/scripts/models-check.mjs ] && [ -f web/models/manifest.json ]; then
            echo "found web/scripts/models.mjs, web/scripts/models-check.mjs and web/models/manifest.json"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "run this workflow on a branch that contains the AI models code"
            echo "(this branch has no web/scripts/models.mjs or models-check.mjs: choose the branch under \"Use workflow from\", e.g. lightbench/depth-mask)"
            {
              echo "## AI models"
              echo
              echo "Nothing done: run this workflow on a branch that contains the AI models code (**Use workflow from**, e.g. \`lightbench/depth-mask\`). \`${GITHUB_REF_NAME}\` has none."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the inputs
        if: steps.code.outputs.present == 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "::error::run this workflow from a branch (it commits the pinned manifest back to it), not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi
          case "${TASK}" in
            pin-and-check|check|masks-prep|masks-prep2) ;;
            *) echo "::error::unknown task '${TASK}' (pin-and-check, check or masks-prep)"; exit 1 ;;
          esac
          if [ -n "${REVISION}" ]; then
            if ! [[ "${REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::revision must be a 40-digit lower-case commit hash, got '${REVISION}'"
              exit 1
            fi
            if [ "${TASK}" != "pin-and-check" ]; then
              echo "::warning::revision is used only by pin-and-check; check uses the commit the manifest pins"
            fi
          fi
          {
            echo "## AI models: ${TASK}"
            echo
            echo "Branch \`${GITHUB_REF_NAME}\` at \`$(git rev-parse --short HEAD)\`${REVISION:+, revision \`${REVISION}\`}."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.code.outputs.present == 'true' && !startsWith(inputs.task, 'masks-prep')
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.code.outputs.present == 'true' && !startsWith(inputs.task, 'masks-prep')
        working-directory: web
        run: npm ci

      - name: Pin
        if: steps.code.outputs.present == 'true' && inputs.task == 'pin-and-check'
        working-directory: web
        run: |
          echo "manifest before:"
          node scripts/models.mjs show
          args=(pin --save "${RUNNER_TEMP}/models")
          if [ -n "${REVISION}" ]; then args+=(--revision "${REVISION}"); fi
          node scripts/models.mjs "${args[@]}"
          echo "manifest after:"
          node scripts/models.mjs show
          git diff --stat -- models/manifest.json
          {
            echo "### Pinned"
            echo
            node scripts/models.mjs show --markdown
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the real model
        if: steps.code.outputs.present == 'true' && !startsWith(inputs.task, 'masks-prep')
        working-directory: web
        run: |
          if [ "${TASK}" = "pin-and-check" ]; then
            # The files pin just downloaded and checked against their Git LFS pointers.
            node scripts/models-check.mjs --files "${RUNNER_TEMP}/models"
          else
            # Downloaded from the pinned Hugging Face URLs.
            node scripts/models-check.mjs
          fi

      - name: Check the pinned manifest with the deploy step and the app's tests
        if: steps.code.outputs.present == 'true' && inputs.task == 'pin-and-check'
        working-directory: web
        run: |
          # The deploy workflow's own step, from the files already here (no second download).
          node scripts/models.mjs fetch --out "${RUNNER_TEMP}/site" --from "${RUNNER_TEMP}/models"
          # The tests and types that read web/models/manifest.json.
          npx tsc -b
          npx vitest run src/ai scripts

      - name: Commit the pinned manifest
        if: steps.code.outputs.present == 'true' && inputs.task == 'pin-and-check'
        run: |
          if git diff --quiet -- web/models/manifest.json; then
            echo "web/models/manifest.json unchanged: nothing to commit"
            echo "web/models/manifest.json is unchanged: nothing committed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rev=$(node -p 'require("./web/models/manifest.json").models.map((m) => m.source.revision).join(", ")')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/models/manifest.json
          git commit --quiet -F - <<EOF
          AI models: pin Depth Anything V2 Small to ${rev}

          Pinned and checked by the "AI models" workflow (run ${GITHUB_RUN_ID}): the
          revision, and each file's size and SHA-256 from its Git LFS pointer, checked
          against the download and run through the app's own preprocessing in Node.

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_0181RBB2b9F97WCBoqXW1yHb
          EOF
          git show --stat --format='committed %h %s' HEAD
          if ! git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            echo "the branch moved while this ran: rebasing the manifest commit onto it"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          echo "pushed $(git rev-parse --short HEAD) to ${GITHUB_REF_NAME}"
          echo "Committed \`$(git rev-parse --short HEAD)\` (web/models/manifest.json only) to \`${GITHUB_REF_NAME}\`." >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- masks-prep (read-only; commits nothing)
      - uses: actions/setup-node@v4
        if: steps.code.outputs.present == 'true' && startsWith(inputs.task, 'masks-prep')
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.code.outputs.present == 'true' && startsWith(inputs.task, 'masks-prep')
        with:
          python-version: "3.12"

      - name: "masks-prep: install tools (runner only)"
        if: steps.code.outputs.present == 'true' && startsWith(inputs.task, 'masks-prep')
        run: |
          echo "MASKS_DIR=${RUNNER_TEMP}/masks" >> "$GITHUB_ENV"
          echo "ORT_NODE_DIR=${RUNNER_TEMP}/ortnode" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/masks" "${RUNNER_TEMP}/ortnode"
          # onnxruntime-node 1.30.0 (CPU EP + its WebGPU EP over Dawn/Vulkan); skip the optional CUDA download.
          # Retried: run 39652979118 lost this download to a network reset (npm ECONNRESET).
          for i in 1 2 3 4 5; do
            (cd "${RUNNER_TEMP}/ortnode" && ONNXRUNTIME_NODE_INSTALL=skip npm install --no-save --no-audit --no-fund --fetch-retries=5 onnxruntime-node@1.30.0) && break
            if [ "$i" = 5 ]; then exit 1; fi
            echo "npm install failed (attempt $i); retrying in $((i * 15)) s"; sleep $((i * 15))
          done
          node -e "const o=require('${RUNNER_TEMP}/ortnode/node_modules/onnxruntime-node'); console.log('onnxruntime-node', require('${RUNNER_TEMP}/ortnode/node_modules/onnxruntime-node/package.json').version)"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --retries 10 onnx numpy pillow ai-edge-litert onnxruntime || python -m pip install --quiet --retries 10 onnx numpy pillow ai-edge-litert onnxruntime
          python -m pip show onnx ai-edge-litert onnxruntime | grep -E '^(Name|Version)'
          # Software Vulkan (Mesa lavapipe) so the WebGPU EP finds an adapter on a GPU-less runner.
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 vulkan-tools >/dev/null || echo "::warning::lavapipe install failed"
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|driverName|apiVersion|deviceType' || true
          if [ "${TASK}" = "masks-prep2" ]; then
            # onnxruntime-web 1.30.0 (the app's version) and Playwright's headless Chromium for the browser runs.
            for i in 1 2 3 4 5; do
              (cd "${RUNNER_TEMP}/ortnode" && ONNXRUNTIME_NODE_INSTALL=skip npm install --no-save --no-audit --no-fund --fetch-retries=5 onnxruntime-node@1.30.0 onnxruntime-web@1.30.0 playwright@1.56.1) && break
              if [ "$i" = 5 ]; then exit 1; fi
              sleep $((i * 15))
            done
            for i in 1 2 3; do (cd "${RUNNER_TEMP}/ortnode" && npx --yes playwright@1.56.1 install --with-deps chromium) && break; sleep 20; done
            echo "PLAYWRIGHT_DIR=${RUNNER_TEMP}/ortnode/node_modules" >> "$GITHUB_ENV"
            echo "ORT_WEB_DIST=${RUNNER_TEMP}/ortnode/node_modules/onnxruntime-web/dist" >> "$GITHUB_ENV"
            node -e "console.log('onnxruntime-web', require('${RUNNER_TEMP}/ortnode/node_modules/onnxruntime-web/package.json').version)"
          fi

      - name: "masks-prep: pin and download"
        if: steps.code.outputs.present == 'true' && startsWith(inputs.task, 'masks-prep')
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/masks-prep.mjs pin --dir "${MASKS_DIR}"

      - name: "masks-prep: export EfficientViT-Seg B1 to ONNX"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python -m venv "${RUNNER_TEMP}/evenv"
          . "${RUNNER_TEMP}/evenv/bin/activate"
          pip install --quiet torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          # Keep torch 2.5.1 (its torch.onnx.export defaults to the TorchScript exporter the repo's export uses).
          printf 'torch==2.5.1\ntorchvision==0.20.1\n' > "${RUNNER_TEMP}/torch-pin.txt"
          pip install --quiet -c "${RUNNER_TEMP}/torch-pin.txt" triton==3.1.0 onnx onnxsim onnxruntime omegaconf pyyaml pillow \
            tqdm numpy timm einops scipy "git+https://github.com/facebookresearch/segment-anything.git"
          python -c "import torch, timm; print('torch', torch.__version__, 'timm', timm.__version__)"
          git clone --quiet --depth 1 https://github.com/mit-han-lab/efficientvit.git "${RUNNER_TEMP}/efficientvit"
          python -I web/scripts/masks-prep/export_efficientvit.py --dir "${MASKS_DIR}" --repo "${RUNNER_TEMP}/efficientvit" --opset 17 --size 512

      - name: "masks-prep: inspect the ONNX graphs"
        if: always() && steps.code.outputs.present == 'true' && startsWith(inputs.task, 'masks-prep')
        run: python -I web/scripts/masks-prep/inspect_models.py --dir "${MASKS_DIR}" --photos web/scripts/masks-prep

      - name: "masks-prep: one run each on the CPU (onnxruntime-node)"
        if: always() && steps.code.outputs.present == 'true' && startsWith(inputs.task, 'masks-prep')
        working-directory: web
        run: node scripts/masks-prep.mjs run --dir "${MASKS_DIR}" --ep cpu

      - name: "masks-prep: MediaPipe TFLite vs community ONNX"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep'
        continue-on-error: true
        run: python -I web/scripts/masks-prep/tflite_compare.py --dir "${MASKS_DIR}"

      - name: "masks-prep: WebGPU EP on software Vulkan (onnxruntime-node)"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep'
        continue-on-error: true
        timeout-minutes: 60
        working-directory: web
        run: node scripts/masks-prep.mjs run --dir "${MASKS_DIR}" --ep webgpu --timeout 300

      - name: "masks-prep: report"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep'
        working-directory: web
        run: node scripts/masks-prep.mjs report --dir "${MASKS_DIR}"

      - name: "masks-prep: collect the artifact"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep'
        run: |
          mkdir -p "${RUNNER_TEMP}/masks-artifact"
          cp -r "${MASKS_DIR}/out" "${RUNNER_TEMP}/masks-artifact/" 2>/dev/null || true
          cp "${MASKS_DIR}"/*.json "${RUNNER_TEMP}/masks-artifact/" 2>/dev/null || true
          if [ -d "${MASKS_DIR}/webgpu-logs" ]; then tar czf "${RUNNER_TEMP}/masks-artifact/webgpu-logs.tgz" -C "${MASKS_DIR}" webgpu-logs; fi
          ls -la "${RUNNER_TEMP}/masks-artifact" "${RUNNER_TEMP}/masks-artifact/out" 2>/dev/null | head -80

      - uses: actions/upload-artifact@v4
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep'
        with:
          name: masks-prep-${{ github.run_id }}
          path: ${{ runner.temp }}/masks-artifact
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------------------- masks-prep2 (read-only; commits nothing)
      - name: "masks-prep2: rewrite the models (SAM 2.1 fp32 Softmax chunks, BiRefNet_lite Split/Concat/Conv)"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep2'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          D="${MASKS_DIR}"; mkdir -p "$D/fixed"
          F=web/scripts/masks-prep/fix_models.py
          enc=$(node -p "require('$D/pins.json').models['sam21-tiny'].files['fp32/encoder'].local")
          bf16=$(node -p "require('$D/pins.json').models['birefnet-lite'].files.fp16.local")
          bf32=$(node -p "require('$D/pins.json').models['birefnet-lite'].files.fp32.local")
          python -I $F sam-fix --model "$enc" --out "$D/fixed/sam21_vision_encoder_fp32_chunked.onnx" || echo "::warning::sam-fix failed"
          for v in fp16 fp32; do
            # The SlimSAM encoders have the same over-128 MiB Softmax (global attention, 4096 tokens).
            ss=$(node -p "require('$D/pins.json').models['slimsam-77'].files['$v/encoder'].local")
            python -I $F sam-fix --model "$ss" --out "$D/fixed/slimsam_vision_encoder_${v}_chunked.onnx" || echo "::warning::slimsam $v sam-fix failed"
          done
          for v in fp16 fp32; do
            src=$bf16; [ "$v" = fp32 ] && src=$bf32
            # Wide Split -> Slices, wide Concat -> tree, Convs over 128 MiB -> channel chunks of multiples of 8.
            python -I $F birefnet-fix --model "$src" --out "$D/fixed/birefnet_lite_${v}_patched.onnx" || echo "::warning::birefnet $v fix failed"
          done
          node -e '
            const fs = require("fs"); const d = process.argv[1]; const f = {};
            const add = (k, n) => { if (fs.existsSync(d + "/fixed/" + n)) f[k] = "fixed/" + n };
            add("samFp32", "sam21_vision_encoder_fp32_chunked.onnx"); add("slimsamfp32", "slimsam_vision_encoder_fp32_chunked.onnx"); add("slimsamfp16", "slimsam_vision_encoder_fp16_chunked.onnx"); add("birefnetfp16", "birefnet_lite_fp16_patched.onnx"); add("birefnetfp32", "birefnet_lite_fp32_patched.onnx");
            fs.writeFileSync(d + "/fixed/files.json", JSON.stringify(f)); console.log(JSON.stringify(f))' "$D"
          ls -la "$D/fixed"

      - name: "masks-prep2: verify the rewritten models (onnxruntime-node CPU and WebGPU EP)"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep2'
        continue-on-error: true
        timeout-minutes: 60
        working-directory: web
        run: node scripts/masks-prep2.mjs verify --dir "${MASKS_DIR}" --only "sam21-fp32-chunked/cpu,sam21-fp32-chunked/webgpu,slimsam-fp32-chunked/cpu,slimsam-fp32-chunked/webgpu,slimsam-fp16-chunked/webgpu,birefnet-fp32-patched/cpu,birefnet-fp32-patched/webgpu,birefnet-fp16-patched/cpu,birefnet-fp16-patched/webgpu"

      - name: "masks-prep2: bisect patched BiRefNet_lite fp32 with prefix models (CPU vs WebGPU EP)"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep2'
        continue-on-error: true
        timeout-minutes: 70
        working-directory: web
        run: |
          node scripts/masks-prep2.mjs bisect-prefix --dir "${MASKS_DIR}" --model "${MASKS_DIR}/fixed/birefnet_lite_fp32_patched.onnx" --input input_image \
            --raw "${MASKS_DIR}/raw/birefnet-lite-fp32-astronaut-pixel.f32" --dims 1,3,1024,1024 --out "${MASKS_DIR}/bisect-birefnet-fp32.json" --max-steps 30 --criterion mean

      - name: "masks-prep2: headless Chromium + onnxruntime-web 1.30.0 /webgpu (SlimSAM fp32, native and emulated 128 MiB)"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep2'
        continue-on-error: true
        timeout-minutes: 60
        working-directory: web
        run: |
          node scripts/masks-prep2.mjs browser-jobs --dir "${MASKS_DIR}"
          node scripts/masks-prep/browser-run.mjs --dir "${MASKS_DIR}" --ort "${ORT_WEB_DIST}" --playwright "${PLAYWRIGHT_DIR}" \
            --jobs "${MASKS_DIR}/browser-jobs.json" --only slimsam-fp32-chunked,sam21-fp32-chunked --out "${MASKS_DIR}/browser-native.json" --job-timeout 1500
          node scripts/masks-prep/browser-run.mjs --dir "${MASKS_DIR}" --ort "${ORT_WEB_DIST}" --playwright "${PLAYWRIGHT_DIR}" \
            --jobs "${MASKS_DIR}/browser-jobs.json" --only sam21-fp32-chunked --out "${MASKS_DIR}/browser-emulated128.json" --job-timeout 1500 --emulate-binding 134217728

      - name: "masks-prep2: report"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep2'
        working-directory: web
        run: node scripts/masks-prep2.mjs report --dir "${MASKS_DIR}"

      - name: "masks-prep2: collect the artifacts"
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep2'
        run: |
          D="${MASKS_DIR}"; A="${RUNNER_TEMP}/masks2-artifact"; M="${RUNNER_TEMP}/masks2-models"
          mkdir -p "$A" "$M"
          cp "$D"/*.json "$A/" 2>/dev/null || true
          cp "$D"/fixed/*.json "$A/" 2>/dev/null || true
          cp -r "$D/out" "$A/" 2>/dev/null || true
          cp "$D"/bisect/*.json "$A/" 2>/dev/null || true
          cp "$D"/fixed/*.onnx "$M/" 2>/dev/null || true
          cp "$D"/fixed/*.shapes.json "$A/" 2>/dev/null || true
          (cd "$M" && sha256sum *.onnx 2>/dev/null | tee SHA256SUMS; ls -l)

      - uses: actions/upload-artifact@v4
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep2'
        with:
          name: masks-prep2-${{ github.run_id }}
          path: ${{ runner.temp }}/masks2-artifact
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always() && steps.code.outputs.present == 'true' && inputs.task == 'masks-prep2'
        with:
          name: masks-prep2-models-${{ github.run_id }}
          path: ${{ runner.temp }}/masks2-models
          if-no-files-found: warn
          retention-days: 30
