name: Build and deploy site

# Every push to main builds, checks and deploys the site to GitHub Pages, then tags the release `v<web/package.json
# version>` if that tag doesn't exist yet. Pull requests build and check only.
#
# Rolling back (docs/ROLLBACK.md): Actions → "Build and deploy site" → Run workflow (from main) → type a release tag
# such as v0.6.12 in "Roll back the website" → Run workflow. That tag's code is built and deployed, with its own AI
# models. The next push to main deploys the newest version again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Roll back the website: the release tag to put back, e.g. v0.6.12 (empty: build and deploy main as usual)"
        type: string
        default: ""
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROLLBACK_TO: ${{ inputs.rollback_to }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check the rollback tag
        if: env.ROLLBACK_TO != ''
        working-directory: .
        run: |
          if ! [[ "${ROLLBACK_TO}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${ROLLBACK_TO}' isn't a release tag: type one like v0.6.12 (the repository's Tags list shows them)"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::run the rollback from main (\"Use workflow from: main\"), not ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Empty for pushes and pull requests: the commit that started the run, as before.
          ref: ${{ inputs.rollback_to && format('refs/tags/{0}', inputs.rollback_to) || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # A rolled-back release passed its lint and tests when it was first deployed; they aren't run again, so a rollback is quick.
      - run: npm run lint
        if: env.ROLLBACK_TO == ''
      - run: npm test
        if: env.ROLLBACK_TO == ''
      - name: Build
        run: npm run build
        env:
          # Project sites are served from /<repository-name>/
          BASE_PATH: /${{ github.event.repository.name }}/
      # The AI models (docs/PHASE3.md Part 24): each pinned file of web/models/manifest.json is fetched by its exact
      # URL into dist/models/ and checked by size and SHA-256; a mismatch fails the build. Not in git, not precached.
      # A rolled-back release fetches the models its own manifest pins (releases before Part 24 have none).
      - name: Fetch AI models
        run: |
          if [ -n "${ROLLBACK_TO}" ] && [ ! -f scripts/models.mjs ]; then
            echo "${ROLLBACK_TO} has no AI models to fetch"
            exit 0
          fi
          node scripts/models.mjs fetch --out dist
      - name: Rollback summary
        if: env.ROLLBACK_TO != ''
        working-directory: .
        run: |
          git fetch --quiet --depth=1 origin main
          version=$(node -p 'require("./web/package.json").version')
          {
            echo "## Rolling back the website to ${ROLLBACK_TO}"
            echo
            echo "Built \`${ROLLBACK_TO}\` (version ${version}, commit \`$(git rev-parse --short HEAD)\`) instead of main (\`$(git rev-parse --short FETCH_HEAD)\`)."
            echo "Installed apps and open tabs offer the earlier version with a **Reload** button and switch when it is clicked."
            echo "The next push to main deploys the newest version again."
          } >> "$GITHUB_STEP_SUMMARY"
          # What an earlier version can't read (docs/ROLLBACK.md, "Before you roll back"): a newer library format.
          schema() { sed -n 's/^export const SCHEMA_VERSION = \([0-9]*\).*/\1/p'; }
          s_old=$(schema < web/src/catalog/schema.ts 2>/dev/null)
          s_new=$(git show FETCH_HEAD:web/src/catalog/schema.ts 2>/dev/null | schema)
          echo "library format (catalog schema): ${ROLLBACK_TO} ${s_old:-?}, main ${s_new:-?}"
          if [ -n "${s_old}" ] && [ -n "${s_new}" ] && [ "${s_old}" -lt "${s_new}" ]; then
            msg="Main's library format (${s_new}) is newer than ${ROLLBACK_TO}'s (${s_old}): anyone whose library was opened by main's version sees \"This library was saved by a newer version of LightBench\" until the newest version is deployed again. Nothing in the library is changed or lost."
            echo "::warning title=Rollback::${msg}"
            printf '\n**Warning:** %s\n' "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tags each release once, after it is deployed: v<web/package.json version> on the first push to main with that
  # version (a tag that exists is never moved). These are the tags a rollback can put back.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release
        run: |
          version=$(node -p 'require("./web/package.json").version')
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::web/package.json version '${version}' isn't x.y.z: no tag"
            exit 0
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists: not moved"
            echo "Release tag \`${tag}\` already exists (it marks the first deploy of ${version}); not moved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
          echo "tagged ${GITHUB_SHA} as ${tag}"
          echo "Tagged this deploy as \`${tag}\` (a rollback can put it back)." >> "$GITHUB_STEP_SUMMARY"
